[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphasignal"
version = "0.1.0"
description = "Personal US equity analysis and trading strategy engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "ta>=0.11",
    "yfinance>=0.2.38",
    "sqlalchemy>=2.0",
    "pyarrow>=16.0",
    "httpx>=0.27",       # used by TestClient
    "lxml>=5.0",         # required by pandas.read_html for Wikipedia scraping
    "apscheduler>=3.10", # daily signal scheduler
    "optuna>=3.6",       # MOD-I: Bayesian optimizer
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
