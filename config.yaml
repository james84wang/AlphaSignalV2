universe:
  default: combined
  timeframe: daily
  watchlist_file: data/watchlist.csv
risk:
  stop_loss_method: atr
  stop_loss_atr_mult: 1.5
  stop_loss_atr_period: 14
  position_size_pct: 0.02
  trail_stop_atr_mult: 1.5
  max_concurrent_positions: 10
  reentry_cooldown_bars: 5
  earnings_blackout_bars: 3
backtest:
  start_years_back: 5
  initial_fund: 100000
  slippage_pct: 0.001
  commission_per_trade: 1.0
  # MOD-F: Platform fee (per side — charged on both entry and exit)
  fee_per_share: 0.005
  fee_min: 1.00
  fee_max_pct_of_trade: 0.01
  # MOD-F: Fixed-fractional position sizing (replaces ATR-based 2% risk)
  position_size_pct: 0.08
  position_size_min: 2000
  # MOD-F: ATR stop (governs exits; separate from risk.* which governs trailing)
  atr_stop_multiple: 1.5
  atr_period: 14
  # MOD-F: Portfolio constraints
  max_concurrent_positions: 15
  per_name_cap_pct: 0.30
  top_n: 10
  # MOD-F: Benchmark
  benchmark_symbol: "QQQ"
  risk_free_rate: 0.0
